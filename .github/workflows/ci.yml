name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Claude Code version the plugin is tested with; neither command needs a login or an API key.
      CLAUDE_CODE_VERSION: 2.1.299
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test .
