name: Release

# Builds the single executable on each system (docs/design/v1-core.md 5.5) when a version tag is pushed, tests the
# built program (not the source), and publishes the files with SHA256SUMS. Only this workflow publishes releases.
# Started by hand (Actions > Release > Run workflow) it only builds and tests: the five programs and SHA256SUMS are
# left as the run's artifacts, to download and try as a person would before a tag is pushed. Nothing is published then.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, asset: project-pm-windows-x64.exe }
          - { os: macos-latest, asset: project-pm-macos-arm64 }
          - { os: macos-15-intel, asset: project-pm-macos-x64 }
          - { os: ubuntu-latest, asset: project-pm-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: project-pm-linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: The tag is the package's version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - name: Typecheck and test the source
        run: npm run typecheck && npm test
      - name: Build the bundle and the single executable
        run: npm run build && npm run sea
      - name: Test the built program
        run: |
          exe="$PWD/dist/project-pm"; [ -f "$exe.exe" ] && exe="$exe.exe"
          [ "$("$exe" --version)" = "$(node -p 'require("./package.json").version')" ]
          PROJECT_PM_BIN="$exe" node --import tsx --test test/mcp.spec.ts test/prepush.spec.ts
          PROJECT_PM_BIN="$PWD/dist/project-pm.cjs" node --import tsx --test test/mcp.spec.ts
          mkdir -p ../release && cp "$exe" "../release/${{ matrix.asset }}"
          ls -l ../release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  # The checksums of the five programs, as their own artifact: on a run by hand, they are what to check a download against.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum project-pm-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    # Only a pushed version tag publishes; a run by hand never does, whichever ref it was started on.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish the release with SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum project-pm-* > SHA256SUMS
          cat SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{TAG}}/$GITHUB_REF_NAME/g" ../.github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "project-pm $version" --notes-file notes.md project-pm-* SHA256SUMS

  npm:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (skipped without the NPM_TOKEN secret)
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
