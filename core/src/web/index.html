<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Project PM</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the board</a>
    <header class="top">
      <div class="top__inner">
        <div class="brand" aria-hidden="true"><span class="brand__mark"></span>Project PM</div>
        <div class="top__tools">
          <label class="picker" hidden>
            <span class="visually-hidden" data-t="project"></span>
            <select id="project"></select>
          </label>
          <button type="button" class="theme" id="theme" aria-live="polite"></button>
        </div>
      </div>
    </header>
    <main id="main" class="page" tabindex="-1">
      <section id="state" class="state" hidden aria-live="polite"></section>
      <div id="board" hidden>
        <section class="head" aria-labelledby="name">
          <div class="head__titles">
            <p class="eyebrow" id="eyebrow"></p>
            <h1 class="head__name" id="name"></h1>
            <p class="head__meta"><span id="path"></span><span class="sep" aria-hidden="true">·</span><span id="pm"></span></p>
          </div>
          <p class="live" id="live"><span class="live__dot" aria-hidden="true"></span><span id="live-text"></span></p>
        </section>

        <section class="kpi card" aria-label="Progress">
          <div class="kpi__progress">
            <svg class="ring" id="ring" viewBox="0 0 42 42" width="56" height="56" role="img">
              <circle class="ring__track" cx="21" cy="21" r="17" />
              <circle class="ring__arc" id="ring-arc" cx="21" cy="21" r="17" transform="rotate(-90 21 21)" />
            </svg>
            <div class="kpi__text">
              <p class="kpi__percent" id="percent"></p>
              <p class="kpi__caption" id="ratio-caption"></p>
              <p class="kpi__breakdown" id="breakdown"></p>
            </div>
          </div>
          <dl class="kpi__metrics">
            <div class="metric is-success" id="m-running"><dt></dt><dd></dd><span class="metric__sub"></span></div>
            <div class="metric is-warning" id="m-asking"><dt></dt><dd></dd></div>
            <div class="metric is-claude" id="m-open"><dt></dt><dd></dd></div>
          </dl>
        </section>

        <div class="grid">
          <div class="grid__main">
            <section class="block" aria-labelledby="attention-h">
              <div class="block__head">
                <h2 class="block__title" id="attention-h" data-t="attention"></h2>
                <span class="block__meta" id="attention-n"></span>
              </div>
              <ul class="attention" id="attention"></ul>
            </section>
            <section class="block" aria-labelledby="items-h">
              <div class="block__head">
                <h2 class="block__title" id="items-h"></h2>
                <span class="block__meta" id="items-n"></span>
              </div>
              <label class="toggle"><input type="checkbox" id="done" /><span data-t="showDone"></span></label>
              <ol class="items" id="items"></ol>
            </section>
          </div>
          <aside class="grid__side">
            <section class="block" id="agents-block" hidden aria-labelledby="agents-h">
              <div class="block__head">
                <h2 class="block__title" id="agents-h"></h2>
                <span class="block__meta" id="agents-n"></span>
              </div>
              <ul class="cards" id="agents"></ul>
              <p class="block__note" id="agents-hidden" hidden></p>
            </section>
            <section class="block" aria-labelledby="sessions-h">
              <div class="block__head">
                <h2 class="block__title" id="sessions-h"></h2>
                <span class="block__meta" id="sessions-n"></span>
              </div>
              <ul class="cards" id="sessions"></ul>
              <details class="ended" id="ended" hidden>
                <summary id="ended-toggle"></summary>
                <ul class="rows" id="ended-list"></ul>
              </details>
            </section>
            <p class="readonly" data-t="readonly"></p>
          </aside>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
